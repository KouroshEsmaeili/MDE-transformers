[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mde-transformers"
version = "0.1.0"
description = "Reproducible transformer-based monocular depth estimation research codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.1",
    "torchvision>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mde_transformers"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["h5py", "scipy.io", "torchvision.*"]
ignore_missing_imports = true
